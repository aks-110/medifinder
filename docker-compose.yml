version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medifinder
      POSTGRES_PASSWORD: medifinder
      POSTGRES_DB: medifinder
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medifinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # One-off job: applies schema.sql and seeds catalog + demo accounts, then
  # exits. Re-run any time with: docker compose run --rm migrate
  migrate:
    build: ./backend
    command: npm run db:setup
    environment:
      DATABASE_URL: postgres://medifinder:medifinder@postgres:5432/medifinder
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://medifinder:medifinder@postgres:5432/medifinder
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data:
  mongo_data:
  uploads_data:
