name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medifinder
          POSTGRES_PASSWORD: medifinder
          POSTGRES_DB: medifinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medifinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://medifinder:medifinder@localhost:5432/medifinder
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - name: Syntax check
        run: |
          for f in $(find src -name "*.js"); do node --check "$f"; done
      - name: Set up + seed database
        run: npm run db:setup
      - name: Boot smoke test
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 2
          curl --fail http://localhost:4000/api/health
          curl --fail -X POST http://localhost:4000/api/provider-auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"owner@p1.medifinder.demo","password":"provider123"}'
          curl --fail -X POST http://localhost:4000/api/admin-auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@medifinder.demo","password":"admin123"}'
          kill $SERVER_PID

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t medifinder-backend ./backend
      - name: Build frontend image
        run: docker build -t medifinder-frontend ./frontend
